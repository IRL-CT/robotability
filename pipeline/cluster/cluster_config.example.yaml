# Example cluster config for the Robotability snapshot pipeline.
# Copy this file, fill in the real lab paths, and pass it to run_all.sh
# with --config. Never commit the filled-in copy. Never put real lab paths
# in the repo.
#
# All paths below are PLACEHOLDERS. Replace /share/your-lab with the real
# share root before use.

lab:
  # Directory that holds one sub-directory per dashcam collection day.
  # Layout: <dashcam_root>/<YYYY-MM-DD>/detections.csv and md.csv.
  # See robotability-nyc/feature_processing/traffic.py.
  dashcam_root: /share/your-lab/dashcam/detections

  # Camera counts per intersection from the "Surveilling the Surveillance"
  # dataset. Columns: n_cameras_median, geometry_pano.
  surveillance_csv: /share/your-lab/surveillance/counts_per_intersections.csv

  # NYC 1-foot DEM raster (unzipped NYC_DEM_1ft_Int).
  dem_path: /share/your-lab/dem/DEM_LiDAR_1ft_2010_Improved_NYC_int.tif

# Working area for downloads and intermediate tables.
work_dir: /share/your-lab/robotability/work

# Snapshot output root. Each run writes one dated directory.
output_dir: /share/your-lab/robotability/snapshots

# How the cluster triggers the CI publish workflow after a successful run.
# Stage 6, publish_snapshot.py, reads this. It runs only when the contract
# validator has passed, so no mode can publish a rejected snapshot.
#   dispatch  - call the GitHub repository_dispatch API. Needs github_repo
#               below and GITHUB_TOKEN in the job environment.
#   push      - force-push the orphan branch snapshots-incoming. Needs
#               git_remote below and an SSH deploy key on the node.
#   none      - do not trigger. Nothing publishes unless something else
#               pushes snapshots-incoming for the 6-hourly CI poll to find.
# See RUNBOOK.md section 6 for the setup of each mode.
trigger_mode: dispatch

# Required when trigger_mode is dispatch. The owner/name form.
github_repo: your-org/robotability

# Required when trigger_mode is push. The SSH form.
git_remote: git@github.com:your-org/robotability.git

# Credentials never belong in this file. dispatch reads GITHUB_TOKEN from
# the environment; push uses the node's SSH key.
