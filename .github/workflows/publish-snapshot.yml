# Publish a validated cluster snapshot as a GitHub Release.
#
# This workflow is IO-bound. It validates, releases, and records.
# It performs no data transformation. It installs no tippecanoe and
# no Python data stack. The cluster does all compute (T5).
#
# Triggers:
#   - repository_dispatch [snapshot-ready]: the cluster calls the GitHub
#     API after a successful run. See pipeline/cluster/RUNBOOK.md.
#   - workflow_dispatch: manual run. The artifact_ref input names the
#     branch or tag that holds the snapshot artifacts.
#   - schedule: poll the snapshots-incoming branch head every 6 hours.
#     This is the fallback path for the SSH deploy key mode.
#
# The artifacts live at the root of the orphan snapshots-incoming branch:
# segments.geojson, segments.pmtiles, features.parquet, manifest.json.
name: Publish snapshot

on:
  repository_dispatch:
    types: [snapshot-ready]
  workflow_dispatch:
    inputs:
      artifact_ref:
        description: >-
          Branch or tag that holds the snapshot artifacts. Use a plain
          branch/tag name or a full refs/heads/... or refs/tags/... path.
        required: false
        default: 'snapshots-incoming'
        type: string
  schedule:
    # Every 6 hours. Poll the snapshots-incoming branch head.
    - cron: '0 */6 * * *'

# The workflow creates a release, pushes a commit to main, and asks the
# deploy workflow to run. actions:write is what allows that last part.
permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # STE 1: checkout main. The manifest commit lands on main later.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # STE 2: plain Node is enough. No pnpm cache is needed here.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # STE 3: resolve the artifact ref.
      # The artifact_ref input travels in an env var, never inline in a
      # shell command. This blocks script injection from the input.
      # The script validates the value as a ref pattern before use:
      # refs/heads/<name>, refs/tags/<name>, or a plain branch/tag name
      # made of [A-Za-z0-9._/-]. Anything else fails this step.
      - name: Resolve artifact ref
        id: resolve
        env:
          ARTIFACT_REF: ${{ inputs.artifact_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          REF="snapshots-incoming"
          if [ -n "$ARTIFACT_REF" ]; then
            REF="$ARTIFACT_REF"
          fi
          # Character check first. It applies to every form, including
          # refs/heads/... and refs/tags/... values. The value is always
          # quoted after this point, so no shell expansion can occur.
          case "$REF" in
            ""|-*|*/|*..*|*//*|*[!A-Za-z0-9._/-]*)
              echo "ERROR: artifact_ref is not a valid git ref pattern" >&2
              exit 1
              ;;
          esac
          if ! git ls-remote --exit-code origin "$REF" >/dev/null 2>&1; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              echo "::warning::snapshot ref $REF not found. Nothing to publish yet."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "ERROR: snapshot ref $REF not found on origin" >&2
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      # STE 4: fetch the snapshot artifacts. The orphan branch checks out
      # into snapshot-incoming/. The artifacts sit at its root.
      - name: Fetch snapshot artifacts
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          path: snapshot-incoming

      # STE 4b: expand segments.geojson.
      # The cluster gzips it before pushing because GitHub refuses any
      # blob over 100 MiB and the full city geojson is about 101 MiB.
      # gzip round trips byte for byte, so the manifest sha256 of the
      # uncompressed file still matches and the contract is unchanged.
      # A snapshot pushed with the raw file (an older cluster, or a hand
      # copy) has no .gz and passes through untouched.
      - name: Expand segments.geojson
        if: steps.resolve.outputs.skip != 'true'
        run: |
          cd snapshot-incoming
          if [ -f segments.geojson.gz ]; then
            gunzip --keep --force segments.geojson.gz
            echo "expanded segments.geojson.gz -> $(stat -c %s segments.geojson) bytes"
          elif [ -f segments.geojson ]; then
            echo "segments.geojson is already uncompressed"
          else
            echo "ERROR: the snapshot has neither segments.geojson nor segments.geojson.gz" >&2
            exit 1
          fi

      # STE 5: validation gate. publish_flow.mjs runs the contract
      # validator and gates on its EXIT CODE. It also rejects partial
      # snapshots and stale dates before any release payload exists.
      # A non-zero exit fails this step and nothing is published.
      - name: Validate snapshot
        if: steps.resolve.outputs.skip != 'true'
        run: node scripts/ci/publish_flow.mjs snapshot-incoming

      # STE 6: read the snapshot date from the validated manifest.
      # The date names the release tag: snapshot-<date>.
      - name: Read snapshot date
        if: steps.resolve.outputs.skip != 'true'
        id: snap
        run: |
          DATE=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('snapshot-incoming/manifest.json','utf8')).date)")
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=snapshot-$DATE" >> "$GITHUB_OUTPUT"

      # STE 7: create the release and upload the three artifacts.
      # An existing tag is reused, so a re-run stays idempotent.
      - name: Create release and upload assets
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.snap.outputs.tag }}
          DATE: ${{ steps.snap.outputs.date }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists. Reusing it."
          else
            gh release create "$TAG" \
              --title "Snapshot $DATE" \
              --notes "Robotability cluster snapshot $DATE. Validated against pipeline/contract/cluster_contract.md."
          fi
          gh release upload "$TAG" \
            snapshot-incoming/segments.pmtiles \
            snapshot-incoming/features.parquet \
            snapshot-incoming/manifest.json \
            --clobber

      # STE 8: verify the release assets are retrievable.
      #
      # This step used to require access-control-allow-origin on the
      # release assets, on the assumption that the map fetched them
      # directly. It does not, and release assets never send that header:
      # a HEAD returns a 302 to objects.githubusercontent.com and no CORS
      # header, with or without an Origin request header. So the check
      # reported mirror_needed on every successful publish, which is a
      # standing false alarm.
      #
      # The map reads the artifacts same-origin from public/snapshots/,
      # staged below, so CORS never applies to it. What still matters
      # about the release is that it works as the archive: the assets
      # exist and honour a byte range, which is what a partial download
      # of the pmtiles needs.
      #
      # A failure here does NOT fail the workflow. The site does not
      # depend on these URLs.
      - name: Verify release assets
        if: steps.resolve.outputs.skip != 'true'
        id: serving
        env:
          TAG: ${{ steps.snap.outputs.tag }}
        run: |
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          OK=true
          for FILE in segments.pmtiles features.parquet manifest.json; do
            STATUS=$(curl -sS -L -I -o /dev/null -w '%{http_code}' \
              "$BASE/$FILE" 2>/dev/null || echo 000)
            if [ "$STATUS" != "200" ]; then
              echo "asset $FILE returned HTTP $STATUS, expected 200"
              OK=false
            fi
          done
          # One Range probe. The CDN must answer 206 for byte ranges.
          RANGE_STATUS=$(curl -sS -L -I -o /dev/null -w '%{http_code}' \
            -H "Range: bytes=0-0" "$BASE/segments.pmtiles" 2>/dev/null || echo 000)
          if [ "$RANGE_STATUS" != "206" ]; then
            echo "Range probe returned HTTP $RANGE_STATUS, expected 206"
            OK=false
          fi
          if [ "$OK" = "true" ]; then
            echo "archive_ok=true" >> "$GITHUB_OUTPUT"
            echo "release assets verified: all three present, Range honoured"
          else
            echo "::warning::release archive check failed. The site is unaffected."
            echo "archive_ok=false" >> "$GITHUB_OUTPUT"
          fi

      # STE 9: update the site manifest on main. This runs the same
      # validated flow against the real public/manifest.json. The entry
      # carries the release tag, the asset URL template, and the stats.
      - name: Update public/manifest.json
        if: steps.resolve.outputs.skip != 'true'
        run: node scripts/ci/publish_flow.mjs snapshot-incoming

      # STE 9b: copy the artifacts into the site, same-origin.
      # The map range-fetches the pmtiles from the browser, and GitHub
      # release assets carry no access-control-allow-origin header, so a
      # cross-origin fetch of a release asset is blocked. Serving from
      # the site's own origin needs no CORS at all. The release stays the
      # archive of record. segments.geojson is a validator input only and
      # is not served.
      - name: Stage artifacts into the site
        if: steps.resolve.outputs.skip != 'true'
        env:
          DATE: ${{ steps.snap.outputs.date }}
        run: |
          DEST="public/snapshots/$DATE"
          mkdir -p "$DEST"
          cp snapshot-incoming/segments.pmtiles \
             snapshot-incoming/features.parquet \
             snapshot-incoming/manifest.json \
             "$DEST/"
          du -sh "$DEST"

      # STE 10: commit and push the manifest update and the artifacts.
      #
      # This push does NOT trigger deploy.yml, which this comment used to
      # claim it did. GitHub does not start workflows from a push made
      # with the default GITHUB_TOKEN, to stop a workflow retriggering
      # itself forever. The consequence went unnoticed because nothing
      # fails: the release exists, the manifest is correct on main, every
      # step is green, and the built site keeps serving the previous
      # snapshot until someone happens to push again. STE 11 asks for the
      # deploy explicitly.
      - name: Commit manifest update
        if: steps.resolve.outputs.skip != 'true'
        id: commit
        env:
          DATE: ${{ steps.snap.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/manifest.json "public/snapshots/$DATE"
          if git diff --cached --quiet; then
            echo "manifest unchanged. Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): publish snapshot $DATE"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # STE 11: rebuild the site so the map sees the new snapshot.
      # Skipped when STE 10 committed nothing, since the built site is
      # then already current.
      - name: Trigger site deploy
        if: steps.resolve.outputs.skip != 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref main
          echo "requested deploy.yml on main"
